name: A Stacked Deck of Stars

on:
  workflow_dispatch:
  schedule:
    - cron: "17 1 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/scripts/generate-elation-constellation.mjs"
      - ".github/workflows/elation-constellation.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Stage the contribution constellation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: node .github/scripts/generate-elation-constellation.mjs

      - name: Commit refreshed artwork
        run: |
          if git diff --quiet -- assets/elation-constellation.svg README.md; then
            echo "The stars are already where we left them."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/elation-constellation.svg README.md
          git commit -m "chore: restage the contribution constellation"
          git push
